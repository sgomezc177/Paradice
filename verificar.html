<!DOCTYPE html>
<html lang=es class=h-full bg-slate-950>
<head>
  <meta charset=UTF-8>
  <meta name=viewport content=width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no>
  <title>Paradice - Verificación Oficial de Premios</title>
  
  <!-- Tailwind CSS CDN -->
  <script src=https://cdn.tailwindcss.com></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              cyan: '#00f0ff',
              blue: '#0284c7',
              pink: '#ff007f',
              purple: '#9333ea',
              gold: '#facc15'
            }
          }
        }
      }
    };
  </script>

  <style>
    body {
      background-color: #040814;
      background-image: 
        radial-gradient(ellipse at 50% 10%, rgba(56, 189, 248, 0.25) 0%, transparent 60%),
        radial-gradient(ellipse at 50% 90%, rgba(147, 51, 234, 0.2) 0%, transparent 60%),
        linear-gradient(180deg, #040814 0%, #020617 100%);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    .neon-card {
      background: linear-gradient(180deg, rgba(15, 23, 42, 0.95) 0%, rgba(2, 6, 23, 0.98) 100%);
      box-shadow: 0 0 35px rgba(56, 189, 248, 0.25), inset 0 0 1px rgba(255, 255, 255, 0.2);
    }
  </style>
</head>

<body class=min-h-full flex flex-col items-center justify-center p-3 sm:p-6 text-slate-100>

  <div class=w-full max-w-md neon-card border border-sky-400/50 rounded-3xl p-5 sm:p-7 flex flex-col items-center relative overflow-hidden>
    
    <!-- Decoración de luz superior -->
    <div class=absolute -top-10 left-1/2 -translate-x-1/2 w-44 h-20 bg-sky-400/20 rounded-full blur-2xl pointer-events-none></div>

    <!-- Header Oficial Paradice -->
    <header class=w-full flex items-center justify-between pb-3 mb-4 border-b border-sky-500/25>
      <div class=flex items-center space-x-2>
        <span class=text-amber-400 text-xl>⚡</span>
        <span class=font-black text-sky-400 tracking-tight text-lg>PARADICE</span>
      </div>
      <span class=px-2.5 py-0.5 rounded-full text-[10px] font-black uppercase tracking-wider bg-sky-950 text-sky-300 border border-sky-500/40>
        🛡️ Verificador de Caja
      </span>
    </header>

    <!-- Contenedor Dinámico de Estado -->
    <div id=status-container class=w-full flex flex-col items-center text-center>
      <div class=animate-pulse text-sky-300 text-sm py-8 font-medium>
        Verificando firma criptográfica del ticket...
      </div>
    </div>

    <!-- Tabla Detallada del Ticket -->
    <div id=details-table class=w-full mt-4 space-y-2 text-xs hidden>
      <div class=p-3 rounded-2xl bg-slate-900/90 border border-slate-800 space-y-2>
        
        <div class=flex justify-between items-center py-1 border-b border-slate-800/80>
          <span class=text-slate-400>🎁 Premio</span>
          <span id=field-premio class=font-black text-emerald-300 text-sm>-</span>
        </div>

        <div class=flex justify-between items-center py-1 border-b border-slate-800/80>
          <span class=text-slate-400>🎯 Intento Usado</span>
          <span id=field-intento class=font-bold text-amber-300>-</span>
        </div>

        <div class=flex justify-between items-center py-1 border-b border-slate-800/80>
          <span class=text-slate-400>📅 Fecha de Emisión</span>
          <span id=field-fecha class=font-medium text-slate-200>-</span>
        </div>

        <div class=flex justify-between items-center py-1 border-b border-slate-800/80>
          <span class=text-slate-400>⏰ Hora de Emisión</span>
          <span id=field-hora class=font-medium text-slate-200>-</span>
        </div>

        <div class=flex justify-between items-center py-1 border-b border-slate-800/80>
          <span class=text-slate-400>💻 Dispositivo</span>
          <span id=field-dispositivo class=font-medium text-slate-300 truncate max-w-[200px]>-</span>
        </div>

        <div class=flex justify-between items-center py-1 border-b border-slate-800/80>
          <span class=text-slate-400>🏷️ Terminal / MAC ID</span>
          <span id=field-terminal class=font-mono font-bold text-sky-300>-</span>
        </div>

        <div class=flex justify-between items-center py-1>
          <span class=text-slate-400>🔐 Firma Digital</span>
          <span id=field-sig class=font-mono text-[10px] text-slate-400 truncate max-w-[170px]>-</span>
        </div>

      </div>

      <!-- Botón para Cajero: Canjear Premio -->
      <div id=action-container class=pt-3 w-full>
        <button id=canjear-btn class=w-full py-3 px-4 rounded-xl bg-gradient-to-r from-emerald-600 via-green-500 to-emerald-600 hover:from-emerald-500 hover:to-green-400 text-slate-950 font-black text-xs uppercase tracking-wider shadow-[0_0_20px_rgba(34,197,94,0.5)] active:scale-95 transition-all flex items-center justify-center gap-2>
          <span>✓</span> <span>Marcar Premio como Entregado / Canjeado</span>
        </button>
      </div>

      <!-- Botón Volver al Juego -->
      <div class=pt-2 text-center>
        <a href=index.html class=text-[11px] text-sky-400 hover:text-sky-300 underline font-medium>
          ← Regresar al Juego PARADICE
        </a>
      </div>
    </div>

  </div>

  <script>
    // Algoritmo Criptográfico Anti-Trampas Compartido con PARADICE
    function calcularFirma(intento, premio, fecha, hora, terminal) {
      const secret = "PARADICE_SECRET_SLOT_KEY_2026";
      const raw = intento + '|' + premio + '|' + fecha + '|' + hora + '|' + terminal + '|' + secret;
      let hash1 = 0;
      for (let i = 0; i < raw.length; i++) {
        const char = raw.charCodeAt(i);
        hash1 = ((hash1 << 5) - hash1) + char;
        hash1 = hash1 & hash1;
      }
      let hash2 = 5381;
      for (let i = 0; i < raw.length; i++) {
        hash2 = ((hash2 << 5) + hash2) + raw.charCodeAt(i);
        hash2 = hash2 & hash2;
      }
      return Math.abs(hash1).toString(16).toUpperCase().padStart(8, '0') +
             Math.abs(hash2).toString(16).toUpperCase().padStart(8, '0');
    }

    document.addEventListener('DOMContentLoaded', () => {
      const params = new URLSearchParams(window.location.search);
      const intento = params.get('intento');
      const premio = params.get('premio');
      const codigo = params.get('codigo') || '';
      const fecha = params.get('fecha');
      const hora = params.get('hora');
      const dispositivo = params.get('dispositivo') || 'Desconocido';
      const terminal = params.get('terminal') || 'MAC-DESCONOCIDA';
      const sig = params.get('sig');

      const statusContainer = document.getElementById('status-container');
      const detailsTable = document.getElementById('details-table');
      const actionContainer = document.getElementById('action-container');
      const canjearBtn = document.getElementById('canjear-btn');

      if (!intento || !premio || !fecha || !hora || !sig) {
        statusContainer.innerHTML = '<div class="w-16 h-16 rounded-full bg-rose-950/80 border-2 border-rose-500 flex items-center justify-center text-3xl mb-3 shadow-[0_0_20px_rgba(244,63,94,0.5)]">⚠️</div>' +
          '<h2 class="text-xl font-black text-rose-400 uppercase tracking-tight">Parámetros Incompletos</h2>' +
          '<p class="text-xs text-slate-400 mt-1 max-w-xs">El enlace o código QR no contiene todos los datos de seguridad necesarios para validar el premio.</p>' +
          '<a href="index.html" class="mt-4 px-4 py-2 rounded-xl bg-slate-800 text-xs font-bold text-sky-300">Ir a Paradice</a>';
        return;
      }

      // 1. Verificar firma de seguridad
      const firmaEsperada = calcularFirma(intento, premio, fecha, hora, terminal);
      const esFirmaValida = (sig === firmaEsperada);

      // 2. Verificar si ya fue canjeado en el almacenamiento
      const estadoCanjeado = localStorage.getItem('paradice_redeemed_' + sig);

      // Llenar campos de la tabla
      document.getElementById('field-premio').textContent = (codigo ? codigo + ' ' : '') + premio;
      document.getElementById('field-intento').textContent = 'Intento ' + intento + ' de 3';
      document.getElementById('field-fecha').textContent = fecha;
      document.getElementById('field-hora').textContent = hora;
      document.getElementById('field-dispositivo').textContent = decodeURIComponent(dispositivo);
      document.getElementById('field-terminal').textContent = terminal;
      document.getElementById('field-sig').textContent = sig;

      detailsTable.classList.remove('hidden');

      if (!esFirmaValida) {
        statusContainer.innerHTML = '<div class="w-16 h-16 rounded-full bg-rose-950/80 border-2 border-rose-500 flex items-center justify-center text-3xl mb-3 shadow-[0_0_25px_rgba(244,63,94,0.6)]">❌</div>' +
          '<span class="px-3 py-1 rounded-full text-[10px] font-black uppercase tracking-wider bg-rose-950 text-rose-300 border border-rose-500/50 mb-2">Firma Inválida</span>' +
          '<h2 class="text-xl sm:text-2xl font-black text-rose-300 uppercase tracking-tight">ALERTA: TICKET ALTERADO</h2>' +
          '<p class="text-xs text-rose-200/80 mt-1.5 max-w-xs leading-relaxed">La firma digital no coincide. Los parámetros del premio o intento fueron modificados manualmente por el usuario. <strong>No entregar el premio.</strong></p>';
        actionContainer.classList.add('hidden');
        return;
      }

      if (estadoCanjeado) {
        statusContainer.innerHTML = '<div class="w-16 h-16 rounded-full bg-amber-950/80 border-2 border-amber-500 flex items-center justify-center text-3xl mb-3 shadow-[0_0_25px_rgba(245,158,11,0.5)]">⏳</div>' +
          '<span class="px-3 py-1 rounded-full text-[10px] font-black uppercase tracking-wider bg-amber-950 text-amber-300 border border-amber-500/50 mb-2">Ya Canjeado</span>' +
          '<h2 class="text-xl sm:text-2xl font-black text-amber-300 uppercase tracking-tight">PREMIO PREVIAMENTE ENTREGADO</h2>' +
          '<p class="text-xs text-slate-300 mt-1.5 max-w-xs leading-relaxed">Este ticket ya fue canjeado en caja el: <br><span class="font-bold text-amber-200">' + estadoCanjeado + '</span>.</p>';
        actionContainer.innerHTML = '<div class="p-3 rounded-xl bg-amber-950/40 border border-amber-500/30 text-center text-amber-200 text-xs font-bold">✓ Registro de canje activo (Ticket bloqueado para evitar doble entrega)</div>';
        return;
      }

      // Ticket Válido y pendiente de canje
      statusContainer.innerHTML = '<div class="w-16 h-16 rounded-full bg-emerald-950/80 border-2 border-emerald-400 flex items-center justify-center text-3xl mb-3 shadow-[0_0_25px_rgba(52,211,153,0.5)] animate-pulse">✓</div>' +
        '<span class="px-3 py-1 rounded-full text-[10px] font-black uppercase tracking-wider bg-emerald-950 text-emerald-300 border border-emerald-500/50 mb-2">Verificado Oficialmente</span>' +
        '<h2 class="text-2xl sm:text-3xl font-black text-white uppercase tracking-tight">' + premio + '</h2>' +
        '<p class="text-xs text-emerald-300 font-bold mt-1">✓ Ticket 100% Auténtico y Válido para Reclamo</p>';

      // Evento del botón de Canje
      canjearBtn.addEventListener('click', () => {
        const ahora = new Date().toLocaleString('es-CO');
        localStorage.setItem('paradice_redeemed_' + sig, ahora);
        
        canjearBtn.disabled = true;
        canjearBtn.className = 'w-full py-3 px-4 rounded-xl bg-slate-800 text-slate-400 font-bold text-xs uppercase cursor-not-allowed';
        canjearBtn.textContent = '✓ Premio Canjeado con Éxito';

        statusContainer.innerHTML = '<div class="w-16 h-16 rounded-full bg-emerald-950/80 border-2 border-emerald-400 flex items-center justify-center text-3xl mb-3 shadow-[0_0_30px_rgba(52,211,153,0.7)]">🎉</div>' +
          '<span class="px-3 py-1 rounded-full text-[10px] font-black uppercase tracking-wider bg-emerald-950 text-emerald-300 border border-emerald-500/50 mb-2">Canje Completado</span>' +
          '<h2 class="text-xl sm:text-2xl font-black text-emerald-300 uppercase tracking-tight">¡ENTREGA CONFIRMADA!</h2>' +
          '<p class="text-xs text-slate-300 mt-1">Se ha registrado el canje a las ' + ahora + '.</p>';
      });
    });
  </script>
</body>
</html>
